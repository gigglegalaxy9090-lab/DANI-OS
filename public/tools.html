<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANI OS - Tools</title>
<link rel="stylesheet" href="tools.css">
</head>

<body>

<header>
    <h1>🛠️ ابزارهای ساخت</h1>
    <p>DANI OS Creation Tools</p>
</header>

<main>

    <section class="tools-grid">

        <div class="tool-card">
            <h2>🌐 ابزار ساخت سایت</h2>
            <p>ساخت و ویرایش کدهای ساده سایت</p>
            <button data-tool="website">باز کردن</button>
        </div>

        <div class="tool-card">
            <h2>📄 ابزار ساخت فایل</h2>
            <p>ساخت فایل‌های مختلف برای پروژه</p>
            <button data-tool="file">باز کردن</button>
        </div>

        <div class="tool-card">
            <h2>🎨 قالب‌های آماده</h2>
            <p>استفاده از قالب‌های آماده برای شروع سریع</p>
            <button data-tool="templates">باز کردن</button>
        </div>

    </section>

    <section id="toolArea" class="tool-area">
        <h2>یک ابزار را انتخاب کن</h2>
        <p>ابزار موردنظر خودت را از بالا انتخاب کن.</p>
    </section>

</main>

<script src="tools.js"></script>

</body>
  </html>
