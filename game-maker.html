<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANI OS - Game Maker</title>
</head>

<body>

<h1>🎮 سازنده بازی DANI OS</h1>

<p>
ساخت پروژه بازی برای موبایل و وب
</p>


<section>

<h2>ساخت بازی جدید</h2>

<input 
id="gameName" 
placeholder="نام بازی"
>


<select id="gameType">

<option value="mobile">
بازی موبایل
</option>

<option value="web">
بازی وب
</option>

<option value="simple">
بازی ساده
</option>

</select>


<button id="createGame">
ساخت بازی
</button>

</section>



<section>

<h2>پروژه‌های بازی</h2>

<ul id="gameList"></ul>

</section>



<script src="game-maker.js"></script>

</body>

  </html>
